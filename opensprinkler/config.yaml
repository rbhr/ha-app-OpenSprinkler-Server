name: OpenSprinkler
version: "1.1.0"
slug: opensprinkler
description: OpenSprinkler Pi irrigation controller, with or without sprinkler hardware
url: https://github.com/rbhr/ha-app-OpenSprinkler-Server
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
image: ghcr.io/rbhr/{arch}-opensprinkler

# Ingress gives the sidebar panel. It works because the OpenSprinkler UI
# derives its API base from document.URL rather than using root-absolute
# paths -- home.js does
#   document.URL.match( /(https?:\/\/.*)\/.*?/ )[ 1 ] + "/sp?pw=..."
# and the greedy .* takes everything up to the LAST slash, so under ingress it
# produces .../api/hassio_ingress/<token>/sp, which Supervisor forwards to /sp.
# Verified end to end against a local stand-in for supervisor/api/ingress.py:
# the whole UI works and not one request reached the add-on with a doubled
# slash. Do not "simplify" this to a path-rewriting proxy; none is needed.
ingress: true
ingress_port: 88
ingress_entry: /
panel_icon: mdi:sprinkler
panel_title: OpenSprinkler

# Port 88 is ALSO published directly, and that is not redundant: other
# applications on the network talk to the controller's HTTP API and cannot go
# through an ingress token. Keep the container side at 88 -- the firmware
# persists its HTTP port in iopts.dat and that value wins over anything set
# here, so the two becoming unreachable is a real failure mode if they drift.
ports:
  88/tcp: 88
ports_description:
  88/tcp: OpenSprinkler web UI and HTTP API
webui: "http://[HOST]:[PORT:88]/"

# Hardware is optional: these are the two device classes the OSPI build opens,
# and run.sh reports at startup which of them actually turned up.
#   /dev/gpiochip*  lgpio claims station and sensor pins   (gpio.cpp)
#   /dev/i2c-*      zone/sensor expanders, RTC, ADS1115    (i2cd.h)
# gpiochip4 is the Pi 5 (bcm2712) primary; gpiochip0 is every earlier Pi.
# i2c-1 is any board the firmware recognises as a Pi, i2c-0 the fallback.
devices:
  - /dev/gpiochip0
  - /dev/gpiochip4
  - /dev/i2c-1
  - /dev/i2c-0

map:
  - type: data
    read_only: false

options:
  require_hardware: false
schema:
  require_hardware: bool
