name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: opensprinkler

jobs:
  init:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      firmware: ${{ steps.firmware.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve add-on version
        id: version
        run: |
          version="$(awk '/^version:/{print $2; exit}' opensprinkler/config.yaml | tr -d "\"'")"
          if [ -z "${version}" ]; then
            echo "::error::Could not read version from opensprinkler/config.yaml"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Add-on version: ${version}"

      - name: Resolve firmware base image
        id: firmware
        run: |
          # opensprinkler/build.yaml stays the single place the firmware version
          # is pinned, but the split builder actions do not read it -- only
          # Supervisor does, when a user builds the add-on locally from source.
          # So read it here and hand it to build-image as a build arg.
          images="$(awk '
            /^build_from:/ { inblock = 1; next }
            inblock && /^[^[:space:]]/ { inblock = 0 }
            inblock && /^[[:space:]]+[A-Za-z0-9_]+:[[:space:]]*[^[:space:]]/ { print $2 }
          ' opensprinkler/build.yaml | tr -d "\"'")

          if [ -z "${images}" ]; then
            echo "::error::Could not read build_from from opensprinkler/build.yaml"
            exit 1
          fi

          # One BUILD_FROM is passed for every architecture, so they must agree.
          # The tag names a multi-arch manifest; the per-arch --platform picks
          # the right leg. Divergent entries would silently build the wrong one.
          if [ "$(echo "${images}" | sort -u | wc -l)" -ne 1 ]; then
            echo "::error::build_from entries differ; all architectures must name the same tag"
            echo "${images}"
            exit 1
          fi

          image="$(echo "${images}" | head -n1)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Firmware base image: ${image}"

      - name: Prepare matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }}
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.init.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and push ${{ matrix.arch }}
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: ./opensprinkler
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          version: ${{ needs.init.outputs.version }}
          build-args: |
            BUILD_FROM=${{ needs.init.outputs.firmware }}
          push: true
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          # build-image does not set revision; without this, published images
          # record no commit provenance.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Publish manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
